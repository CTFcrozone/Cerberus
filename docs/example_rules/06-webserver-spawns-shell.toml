[rule]
id = "webserver-spawns-shell"
description = "Web server process executed a shell — strong indicator of web shell or RCE"
severity = "critical"

[[rule.conditions]]
field = "process.parent.comm"
op = "in"
value = ["nginx", "apache2", "httpd", "php-fpm", "node", "gunicorn"]

[[rule.conditions]]
field = "process.filepath"
op = "regex"
value = "/(sh|bash|dash|zsh|ksh)$"
