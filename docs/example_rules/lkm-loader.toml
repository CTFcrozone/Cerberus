[rule]
id = "kernel-module-loader"
description = "Detect kernel module loading"
severity = "critical"

[[rule.conditions]]
field = "module.name"
op = "=="
value = "lkm"

[rule.sequence]
id = "lkm-loader-seq"
kind = "rule"

[[rule.sequence.steps]]
rule_id = "rk-load"
within = "10s"

[rule.response_chain]
trigger = "sequence_finished"

[[rule.response_chain.actions]]
type = "block_ip"
params = { ip = "1.1.1.1" }

[[rule.response_chain.actions]]
type = "block_ip"
params = { ip = "8.8.8.8" }
