[rule]
id = "ptrace-credential-process"
description = "ptrace against a credential-bearing process — memory credential theft"
severity = "critical"

[[rule.conditions]]
field = "ptrace.mode"
op = "bit_and"
value = 2

[[rule.conditions]]
field = "process.target.comm"
op = "in"
value = ["sshd", "ssh-agent", "gpg-agent", "gnome-keyring-d", "vaultd", "sudo", "su", "polkitd"]
