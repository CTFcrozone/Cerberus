[rule]
id = "etc-file-deleted"
description = "Configuration file under /etc unlinked by a non-root user"
severity = "medium"

[[rule.conditions]]
field = "inode.op"
op = "=="
value = 0

[[rule.conditions]]
field = "inode.filename"
op = "starts_with"
value = "/etc/"

[[rule.conditions]]
field = "process.uid"
op = "!="
value = 0
