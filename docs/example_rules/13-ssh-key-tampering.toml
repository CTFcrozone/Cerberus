[rule]
id = "ssh-key-tampering"
description = "SSH authorized_keys or host key removed — persistence tampering or cleanup"
severity = "high"

[[rule.conditions]]
field = "inode.op"
op = "=="
value = 0

[[rule.conditions]]
field = "inode.filename"
op = "regex"
value = "(authorized_keys2?|ssh_host_[a-z0-9]+_key)$"
